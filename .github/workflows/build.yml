name: Build

# Sanity-checks that the app builds on macOS and Windows on every push to main /
# PR, and on any "v*" tag. This intentionally does NOT publish anything: the
# macOS build here is unsigned (CI has no code-signing certificate), and the
# repo's default GITHUB_TOKEN is read-only, so an auto-publish step would just
# fail with 403 anyway. Actual releases are built locally (where signing works)
# and uploaded to a GitHub Release by hand — see CONTRIBUTING.md.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build & package (${{ matrix.os }})
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # unsigned build; see README for code-signing notes

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-networth-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: warn
